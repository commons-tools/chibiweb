<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こむぎ舎｜町の小さなパン屋</title>
<meta name="description" content="国産小麦と自家製酵母で焼く、町の小さなパン屋です。">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/site.js" defer></script>
<script src="/news/embed.js" defer></script>
</head>
<body>
<site-header><a href="/">こむぎ舎</a></site-header>

<main>
  <!-- メイン写真：横幅3サイズ（800/1600/2400px、3:2）。差し替えは assets/img/ の同じ名前で上書き -->
  <figure class="hero-image">
    <img src="/assets/img/hero-1600.webp"
         srcset="/assets/img/hero-800.webp 800w, /assets/img/hero-1600.webp 1600w, /assets/img/hero-2400.webp 2400w"
         sizes="100vw" width="2400" height="1600"
         alt="店頭の棚に並んだ焼きたてのパン" fetchpriority="high">
  </figure>

  <div class="page">
  <section class="hero">
    <h1>毎朝7時、<br>焼きたてから。</h1>
    <p>国産小麦と自家製酵母で焼く、町の小さなパン屋です。食パンと、日々のおやつパンを10種類ほど並べています。</p>
    <a class="button" href="/menu.html">パンのご案内</a>
  </section>

  <section class="section" aria-labelledby="t-hours">
    <h2 class="section-title" id="t-hours">営業時間</h2>
    <dl class="info-list">
      <div><dt>営業時間</dt><dd>7:00〜17:00（売り切れしだい閉店）</dd></div>
      <div><dt>定休日</dt><dd>月曜・火曜</dd></div>
    </dl>
    <!-- その日のパンはInstagramで。URLは自分のアカウントに書き換える -->
    <p class="sns-link"><a href="https://www.instagram.com/">今日のパンはInstagramで</a></p>
  </section>

  <section class="section" aria-labelledby="t-news">
    <h2 class="section-title" id="t-news">お知らせ</h2>
    <div data-news data-channel="info" data-count="3" data-link="/news.html#{id}" data-more="/news.html"></div>
  </section>

  <section class="section" aria-labelledby="t-event">
    <h2 class="section-title" id="t-event">パン教室</h2>
    <div data-news data-channel="event" data-count="2"></div>
  </section>

  <section class="section" aria-labelledby="t-pages">
    <h2 class="section-title" id="t-pages">ご案内</h2>
    <ul class="child-pages">
      <li><a href="/menu.html"><strong>パンのご案内</strong><span>定番のパンと、季節のパン</span></a></li>
      <li><a href="/about.html"><strong>お店について</strong><span>アクセス・ご予約・お取り置き</span></a></li>
    </ul>
  </section>
  </div>
</main>

<site-footer></site-footer>
</body>
</html>
